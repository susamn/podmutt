workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - build
  - analyze

default:
  image: golang:1.27.2-bookworm
  interruptible: true
  cache:
    key:
      prefix: go-1.27.2-linux-amd64
      files:
        - go.mod
        - go.sum
    paths:
      - .cache/go-build/
      - .cache/go-mod/

variables:
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOTOOLCHAIN: local
  # Bound compiler memory for the pure-Go SQLite driver, including race builds.
  GOGC: "20"

verify:
  stage: verify
  script:
    - make check
  coverage: '/Total coverage: ([0-9]+\.[0-9]+)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage/

race:
  stage: verify
  script:
    - make race

mpv-integration:
  stage: verify
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends mpv
    - make mpv-test

recovery-integration:
  stage: verify
  script:
    - make recovery-test

mpris-integration:
  stage: verify
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends dbus-daemon
    - make mpris-test

build:
  stage: build
  script:
    - make build VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - ./bin/podmutt --version
  artifacts:
    expire_in: 14 days
    paths:
      - bin/podmutt

# Community Build supports default-branch analysis only. Enable after configuring
# protected Sonar variables; never submit an MR as the imported project's main.
sonarqube:
  stage: analyze
  image:
    name: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
    entrypoint: [""]
  tags: [linux, neucleus.local]
  variables:
    GIT_DEPTH: "0"
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    key: sonar-scanner-12.2-linux-amd64
    paths:
      - .sonar/cache/
  dependencies: [verify]
  resource_group: sonarqube-main
  interruptible: false
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG'
      when: never
    - if: '$SONAR_ENABLED == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ': "${SONAR_HOST_URL:?Set SONAR_HOST_URL}"'
    - ': "${SONAR_PROJECT_KEY:?Set SONAR_PROJECT_KEY}"'
    - ': "${SONAR_TOKEN:?Set protected SONAR_TOKEN}"'
    - test -s coverage/coverage.out
    - sonar-scanner -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300

# Opt-in native shell runner. Never count omitted native testing as verified.
native-macos:
  stage: verify
  tags: [macos]
  cache: []
  rules:
    - if: '$PODMUTT_NATIVE_MACOS == "1"'
  script:
    - mkdir -p coverage
    - set -o pipefail
    - make native-verify 2>&1 | tee coverage/native-macos.log
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage/native-macos.log
      - bin/podmutt.app/

cross-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - make dist VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  artifacts:
    expire_in: 30 days
    paths:
      - dist/*.tar.gz
