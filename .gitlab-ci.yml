workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - build

default:
  image: golang:1.27.2-bookworm
  interruptible: true
  cache:
    key:
      prefix: go-1.27.2-linux-amd64
      files:
        - go.mod
        - go.sum
    paths:
      - .cache/go-build/
      - .cache/go-mod/

variables:
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOTOOLCHAIN: local
  # Bound compiler memory for the pure-Go SQLite driver, including race builds.
  GOGC: "20"

verify:
  stage: verify
  script:
    - make check
  coverage: '/Total coverage: ([0-9]+\.[0-9]+)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage/

race:
  stage: verify
  script:
    - make race

mpv-integration:
  stage: verify
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends mpv
    - make mpv-test

mpris-integration:
  stage: verify
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends dbus-daemon
    - make mpris-test

build:
  stage: build
  script:
    - make build VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - ./bin/podmutt --version
  artifacts:
    expire_in: 14 days
    paths:
      - bin/podmutt

# Opt-in native shell runner. Never count omitted native testing as verified.
native-macos:
  stage: verify
  tags: [macos]
  cache: []
  rules:
    - if: '$PODMUTT_NATIVE_MACOS == "1"'
  script:
    - CGO_ENABLED=1 make check race
    - make native-macos native-media-test

cross-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - make dist VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  artifacts:
    expire_in: 30 days
    paths:
      - dist/*.tar.gz
