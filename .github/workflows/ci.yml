name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Verify formatting, modules, vet, and coverage
        run: make check

      - name: Run race detector
        run: make race

      - name: Build static binary
        run: make build

      - name: Verify CLI bootstrap
        run: |
          ./bin/podmutt --version
          ./bin/podmutt --help

      - name: Cross-build distributions
        run: make dist
