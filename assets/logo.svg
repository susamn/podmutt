<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;display=swap');
        </style>
    </defs>
    
    <!-- Main Square Logo Frame -->
    <rect x="32" y="32" width="448" height="448" rx="28" fill="#16191e" stroke="#4b6a63" stroke-width="10"/>
    
    <!-- Central Minimal Icon -->
    
                <g transform="translate(256, 200) scale(1) translate(-256, -200)">
                    <!-- Terminal Prompt Chevron '>' -->
                    <path d="M 130 148 L 182 200 L 130 252" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                    
                    <!-- Audio Equalizer Bars (Podcast Soundwave) -->
                    <line x1="222" y1="168" x2="222" y2="232" stroke="#f3f4f6" stroke-width="14" stroke-linecap="round"/>
                    <line x1="262" y1="126" x2="262" y2="274" stroke="#4ade80" stroke-width="14" stroke-linecap="round"/>
                    <line x1="302" y1="152" x2="302" y2="248" stroke="#f3f4f6" stroke-width="14" stroke-linecap="round"/>
                    <line x1="342" y1="178" x2="342" y2="222" stroke="#4ade80" stroke-width="14" stroke-linecap="round"/>
                    
                    <!-- Subtle Terminal Cursor Underscore -->
                    <line x1="374" y1="250" x2="404" y2="250" stroke="#4ade80" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
                </g>
    <!-- Brand Typography -->
    
                <g transform="translate(256, 382)">
                    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="54" font-weight="600" text-anchor="middle" letter-spacing="-1">
                        <tspan fill="#4ade80">&gt; pod</tspan><tspan fill="#f3f4f6">mutt</tspan>
                    </text>
                </g>
</svg>