# GoReleaser builds the release binaries and updates susamn/homebrew-tap.
# Exercise locally with: goreleaser release --snapshot --clean
version: 2

project_name: podmutt

before:
  hooks:
    - go mod tidy

builds:
  - id: podmutt
    main: ./cmd/podmutt
    binary: podmutt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: podmutt
    ids:
      - podmutt
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - assets/logo.svg
      - assets/logo.png
      - packaging/linux/podmutt.desktop

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^merge:"

homebrew_casks:
  - name: podmutt
    repository:
      owner: susamn
      name: homebrew-tap
      branch: main
      # A fine-grained PAT with Contents:read-write on susamn/homebrew-tap.
      # The default GITHUB_TOKEN cannot push to another repository.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/susamn/podmutt"
    description: "Terminal podcast client inspired by lazygit and mpdtui"
    commit_msg_template: "podmutt {{ .Tag }}"
    caveats: |
      podmutt streams podcast audio through mpv:

        brew install mpv

      macOS first launch:
        If macOS warns that the developer cannot be verified, allow it with:
          xattr -d com.apple.quarantine $(which podmutt)
        (or click "Open Anyway" in System Settings > Privacy & Security).

      Icons use standard Unicode by default (no patched font required).
      To use Nerd Fonts, set `icons = "nerd"` in config.toml.

release:
  github:
    owner: susamn
    name: podmutt
  replace_existing_artifacts: true
  mode: replace

nfpms:
  - id: packages
    package_name: podmutt
    ids:
      - podmutt
    vendor: susamn
    homepage: "https://github.com/susamn/podmutt"
    maintainer: "Supratim Samanta <supratim.iee23.ju2005@gmail.com>"
    description: "Modern, keyboard-driven podcast client (TUI) for Linux"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: sound
    priority: optional
    dependencies:
      - mpv
      - ca-certificates
    file_name_template: "{{ .ConventionalFileName }}"
    contents:
      - src: packaging/linux/podmutt.desktop
        dst: /usr/share/applications/podmutt.desktop
        file_info:
          mode: 0644
      - src: assets/logo.svg
        dst: /usr/share/icons/hicolor/scalable/apps/podmutt.svg
        file_info:
          mode: 0644
      - src: assets/logo.png
        dst: /usr/share/icons/hicolor/512x512/apps/podmutt.png
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/podmutt/copyright
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/podmutt/README.md
        file_info:
          mode: 0644
