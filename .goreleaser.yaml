# GoReleaser builds the release binaries and updates susamn/homebrew-tap.
# Exercise locally with: goreleaser release --snapshot --clean
version: 2

project_name: podmutt

before:
  hooks:
    - go mod tidy

builds:
  - id: podmutt
    main: ./cmd/podmutt
    binary: podmutt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: podmutt
    ids:
      - podmutt
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - assets/logo.svg
      - assets/logo.png
      - packaging/linux/podmutt.desktop

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^merge:"

release:
  github:
    owner: susamn
    name: podmutt
  replace_existing_artifacts: false
  mode: keep-existing

nfpms:
  - id: packages
    package_name: podmutt
    ids:
      - podmutt
    vendor: susamn
    homepage: "https://github.com/susamn/podmutt"
    maintainer: "Supratim Samanta <supratim.iee23.ju2005@gmail.com>"
    description: "Modern, keyboard-driven podcast client (TUI) for Linux"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: sound
    priority: optional
    dependencies:
      - mpv
      - ca-certificates
    file_name_template: "{{ .ConventionalFileName }}"
    contents:
      - src: packaging/linux/podmutt.desktop
        dst: /usr/share/applications/podmutt.desktop
        file_info:
          mode: 0644
      - src: assets/logo.svg
        dst: /usr/share/icons/hicolor/scalable/apps/podmutt.svg
        file_info:
          mode: 0644
      - src: assets/logo.png
        dst: /usr/share/icons/hicolor/512x512/apps/podmutt.png
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/podmutt/copyright
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/podmutt/README.md
        file_info:
          mode: 0644
